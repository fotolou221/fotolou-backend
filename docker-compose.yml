version: '3.8'

services:
  # ── Base de Données Relationnelle PostgreSQL 16 ─────────────
  fotolou-postgresql:
    image: postgres:16-alpine
    container_name: fotolou-postgresql
    environment:
      POSTGRES_DB: fotolou_db
      POSTGRES_USER: fotolou_user
      POSTGRES_PASSWORD: fotolou_secure_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fotolou_user -d fotolou_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fotolou-network

  # ── Cache & Sessions Redis ──────────────────────────────────
  fotolou-redis:
    image: redis:7-alpine
    container_name: fotolou-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fotolou-network

  # ── Interface d'Administration PostgreSQL (pgAdmin 4) ────────
  fotolou-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fotolou-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fotolou.sn
      PGADMIN_DEFAULT_PASSWORD: admin_fotolou_2026
    ports:
      - '5050:80'
    depends_on:
      fotolou-postgresql:
        condition: service_healthy
    networks:
      - fotolou-network

  # ── Backend Spring Boot / JHipster ───────────────────────────
  fotolou-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fotolou-backend-app
    environment:
      SPRING_PROFILES_ACTIVE: prod,api-docs
      SPRING_DATASOURCE_URL: jdbc:postgresql://fotolou-postgresql:5432/fotolou_db
      SPRING_DATASOURCE_USERNAME: fotolou_user
      SPRING_DATASOURCE_PASSWORD: fotolou_secure_password
      JHIPSTER_CACHE_REDIS_SERVER: redis://fotolou-redis:6379
      SMS_PROVIDER: mock
      STORAGE_PROVIDER: local
    ports:
      - '8080:8080'
    depends_on:
      fotolou-postgresql:
        condition: service_healthy
      fotolou-redis:
        condition: service_healthy
    networks:
      - fotolou-network

volumes:
  postgres_data:
  redis_data:

networks:
  fotolou-network:
    driver: bridge
